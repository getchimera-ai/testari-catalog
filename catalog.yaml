        purpose: Flutter SDK used for Dart analysis.
        verified: true
        source: "https://docs.flutter.dev/get-started/install"
        platforms:
          macos:
            detect: flutter
            install:
              kind: homebrew
              package: flutter
          linux:
            detect: flutter
