  - id: flutter-security-audit
    name: Flutter security audit
    rationale: >-
      Review a Flutter application's security boundaries with the calling agent: secret storage,
      transport security, WebView bridges, permissions and logging. The audit is detector-free;
      the agent plans against the criteria, reports evidence and gap-closes like any other run.
    mode: agent-led
    profile: flutter
    criteria:
      - id: flutter.security.secure-storage
        title: Secret storage
        description: >-
          Credentials, tokens and keys are stored in the platform keystore or secure enclave, not
          in SharedPreferences, plain files or source code.
        category: secrets
        severity: high
        remediation: Use flutter_secure_storage or the platform keystore API; never commit secrets.
      - id: flutter.security.transport
        title: Transport security
        description: >-
          Network calls use TLS, do not disable certificate validation, and declare no cleartext
          traffic exception without a documented reason.
        category: cryptography
        severity: high
        cwe: CWE-295
        remediation: Remove badCertificateCallback overrides and cleartext exceptions.
      - id: flutter.security.webview
        title: WebView and JS bridge
        description: >-
          WebViews load trusted origins only and expose no JavaScript bridge that reaches
          privileged platform channels with untrusted input.
        category: injection
        severity: high
        cwe: CWE-79
        remediation: Allowlist origins and keep the JS bridge minimal and validated.
      - id: flutter.security.permissions
        title: Platform permissions
        description: >-
          The manifest and Info.plist request only the permissions the application uses, with a
          user-facing purpose string.
        category: configuration
        severity: medium
        remediation: Remove unused permissions and explain each requested one.
      - id: flutter.security.logging
        title: Sensitive logging
        description: >-
          Logs, analytics and crash reports carry no tokens, personal data or full request bodies.
        category: privacy
        severity: medium
        remediation: Redact sensitive fields before logging or reporting.
    inputs:
      - id: roots
        name: Audit roots
        description: Directories inside the run roots to audit.
        kind: path
        required: true
      - id: focus
        name: Focus symbol
        description: Optional symbol path that narrows the investigation.
        kind: symbol
        required: false
    dynamic:
      plan_schema_version: 2
      stages: [seed, plan, validate, execute, verify, gap_close, consolidate]
      max_gap_iterations: 3
      evidence_required: true
      cross_check: true
    tooling:
      - id: flutter
        purpose: Flutter SDK used for Dart analysis.
        verified: true
        source: "https://docs.flutter.dev/get-started/install"
        platforms:
          macos:
            detect: flutter
            install:
              kind: homebrew
              package: flutter
          linux:
            detect: flutter
      - id: semgrep
        purpose: Optional structural queries over Dart source.
        verified: false
        source: "https://semgrep.dev/docs/supported-languages"
        platforms:
          macos:
            detect: semgrep

  - id: flutter-design-audit
    name: Flutter design review
    rationale: >-
      Review a Flutter application's architecture and user-facing quality with the calling agent:
      layering, state ownership, accessibility and error handling.
    mode: agent-led
    profile: flutter
    criteria:
      - id: flutter.design.layering
        title: Layering
        description: >-
          Presentation, domain and data code sit in separate layers; widgets do not call data
          sources directly and domain code imports no Flutter widgets.
        category: architecture
        severity: medium
      - id: flutter.design.state
        title: State ownership
        description: >-
          State has one owner, rebuilds are scoped to the widgets that read it, and no global
          mutable singleton hides lifecycle bugs.
        category: architecture
        severity: medium
      - id: flutter.design.accessibility
        title: Accessibility
        description: >-
          Interactive elements expose semantics labels, meet touch-target and contrast minimums,
          and remain usable with large text and screen readers.
        category: accessibility
        severity: medium
      - id: flutter.design.error-handling
        title: Error handling
        description: >-
          Futures and streams have error paths, failures reach the user with context, and no
          error is swallowed in an empty catch.
        category: error-handling
        severity: medium
    inputs:
      - id: roots
        name: Audit roots
        description: Directories inside the run roots to audit.
        kind: path
        required: true
      - id: focus
        name: Focus symbol
        description: Optional symbol path that narrows the investigation.
        kind: symbol
        required: false
    dynamic:
      plan_schema_version: 2
      stages: [seed, plan, validate, execute, verify, gap_close, consolidate]
      max_gap_iterations: 3
      evidence_required: true
      cross_check: true
    tooling:
      - id: flutter
        purpose: Flutter SDK used for Dart analysis.
        verified: true
        source: "https://docs.flutter.dev/get-started/install"
        platforms:
          macos:
            detect: flutter
            install:
              kind: homebrew
              package: flutter
          linux:
            detect: flutter

  - id: flutter-dependencies-audit
    name: Flutter dependencies audit
    rationale: >-
      Review a Flutter application's package supply chain with the calling agent: maintenance,
      licensing, pinning and publisher trust.
    mode: agent-led
    profile: flutter
    criteria:
      - id: flutter.dependencies.maintenance
        title: Package maintenance
        description: >-
          Dependencies are maintained, have recent releases and no open security advisory that
          applies to the pinned version.
        category: supply-chain
        severity: high
      - id: flutter.dependencies.licenses
        title: Licence compatibility
        description: >-
          Every dependency's licence is compatible with the product's distribution terms; no
          copyleft package is shipped without a recorded decision.
        category: licensing
        severity: medium
      - id: flutter.dependencies.pinning
        title: Pinning and lockfile
        description: >-
          pubspec.lock is committed, versions are constrained deliberately, and no git or path
          dependency points at an unpinned revision.
        category: supply-chain
        severity: medium
      - id: flutter.dependencies.supply-chain
        title: Publisher trust
        description: >-
          Packages come from verified publishers, package names are not typosquats, and no
          dependency pulls code at build time from an untrusted source.
        category: supply-chain
        severity: high
    inputs:
      - id: roots
        name: Audit roots
        description: Directories inside the run roots to audit.
        kind: path
        required: true
      - id: focus
        name: Focus symbol
        description: Optional symbol path that narrows the investigation.
        kind: symbol
        required: false
    dynamic:
